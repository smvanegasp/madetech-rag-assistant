name: Sync to Hugging Face hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      # ✅ Add this step
      - name: Configure Git LFS
        run: git config lfs.allowincompletepush true

      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push https://smvanegasp:$HF_TOKEN@huggingface.co/spaces/smvanegasp/madetech-rag-assistant main
