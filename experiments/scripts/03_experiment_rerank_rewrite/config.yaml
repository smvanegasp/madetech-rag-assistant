  #   use_query_rewriting: true
  #   use_reranking: false

  # - name: "gpt_oss_20b__rewriting_reranking"
  #   model: "groq/openai/gpt-oss-20b"
  #   use_query_rewriting: true
  #   use_reranking: true

  # --- openai/gpt-4o-mini ---
  # - name: "gpt4o_mini__basic"
  #   model: "openai/gpt-4o-mini"
  #   use_query_rewriting: false
