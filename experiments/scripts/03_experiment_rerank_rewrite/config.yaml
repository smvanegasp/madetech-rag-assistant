# Parallel workers for question evaluation (1 = sequential)
workers: 3

# Output directory for results (relative to this script)
output: "output"

# Optional: load previous run instead of re-running (path to timestamp folder)
# e.g. "output/2026-03-08_12-00-00" (null = run from scratch)
load_from: null

# Generate plots after run (bar chart, by question_type)
save_plots: true
