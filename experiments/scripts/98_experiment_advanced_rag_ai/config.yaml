# Advanced RAG experiment configuration
# Tests different combinations of query rewriting and re-ranking
# Uses questions from 00_questions_generation output (latest run by timestamp)

# Path to questions — "latest" uses the most recent timestamp folder
questions:
  source: "../00_questions_generation/output"
  use_latest: true   # If true, auto-detect latest timestamp folder
  # Or specify a timestamp explicitly, e.g. "2025-03-07_12-30-45"
  # timestamp: null
  files:
    - "test.jsonl"      # Evaluation questions (one per line: question, answer, question_type, doc_metadata)
    - "validation.jsonl" # Optional: also include validation set

# RAG pipeline config (inherits from 02_advanced_rag, overridden per experiment)
base_config:
  vector_db:
    path: "../01_llm_chunking_embedding/output/preprocessed_db"
    collection_name: "docs"
  embedding_model: "text-embedding-3-large"
  retrieval:
    retrieval_k: 10
    final_k: 7
  model: "groq/openai/gpt-oss-20b"

# Experiment variants: each runs with different use_query_rewriting / use_reranking
experiments:
  - name: "basic_rag"
    description: "Basic RAG — no query rewriting, no re-ranking"
    use_query_rewriting: false
    use_reranking: false

  - name: "with_reranking"
    description: "RAG with re-ranking only"
    use_query_rewriting: false
    use_reranking: true

  - name: "with_rewriting"
    description: "RAG with query rewriting only"
    use_query_rewriting: true
    use_reranking: false

  - name: "with_rewriting_and_reranking"
    description: "Full advanced RAG — rewriting + re-ranking"
    use_query_rewriting: true
    use_reranking: true
