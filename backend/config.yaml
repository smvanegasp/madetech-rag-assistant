# RAG pipeline configuration (production)
# Switch approaches via approach.use_query_rewriting / use_reranking

# Vector store (ChromaDB Cloud)
vector_db:
  database: "madetech_handbook"
  collection_name: "docs"

# Embeddings (must match the model used when creating the vector DB)
embedding_model: "text-embedding-3-large"

# Retrieval parameters
retrieval:
  retrieval_k: 10   # Chunks to retrieve per query
  final_k: 10       # Chunks to pass to LLM (same as retrieval_k when not reranking)

# LLM for query rewriting, reranking, and answer generation
model: "groq/openai/gpt-oss-20b"

# Active RAG approach — switch between variants:
# basic_rag: both false | with_reranking: rewriting=false, reranking=true
# with_rewriting: rewriting=true, reranking=false | with_rewriting_and_reranking: both true
approach:
  use_query_rewriting: false
  use_reranking: false
